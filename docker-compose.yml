services:
  api:
    build:
      context: .
      dockerfile: RoboMonitor/Dockerfile
    ports:
      - "5280:8080" # 5280 ekstern og 8080 intern
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: always

  prometheus:
    image: prom/prometheus
    volumes:
      - ./AspireRoboMonitor/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - api
    restart: always

  grafana:
    image: grafana/grafana
    volumes:
      - ./AspireRoboMonitor/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
      - grafana_data:/var/lib/grafana
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    restart: always

  # en Docker service for både publisher og subscriber, da de begge er skrevet i Python og deler samme kodebase
  python_publisher:
    build:
      context: ../ScrabeBot/ros2_ws/src/scrabe_bot_app
    # Vi overskriver standard-kommandoen til at starte pub i stedet for sub
    command: ["/bin/bash", "-c", "source install/setup.bash && ros2 run scrabe_bot_app scrabe_pub"]
    restart: always

  python_subscriber:
    build:
      context: ../ScrabeBot/ros2_ws/src/scrabe_bot_app
    environment:
      # api:8080
      - ROBOMONITOR_API_URL=http://api:8080 
    depends_on:
      - api
    restart: always

volumes:
  prometheus_data:
  grafana_data: