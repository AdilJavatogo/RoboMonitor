name: Byg og Push RoboMonitor API

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adiljavatogo/robomonitor-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Log ind på GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # 1. RETTELSE: Skriv dit navn manuelt med småt i stedet for variablen
          username: adiljavatogo 
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Byg og push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: RoboMonitor/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
